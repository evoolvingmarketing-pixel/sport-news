<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Sportive</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0b0f17;color:#e9eef7}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 18px;color:#b8c4d6}
    .card{background:#111a2b;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px}
    .note{font-size:12px;color:#93a4bf;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>News Sportive</h1>
    <p>Titoli aggiornati automaticamente dalle fonti selezionate.</p>

    <div class="card">
      <!-- RSS WIDGET (lo inseriamo nello Step 4) -->
      <div id="fw-container"></div>
    </div>

    <div class="note">
      Le notizie rimandano sempre alle fonti originali (titolo + link).
    </div>
  </div>
</body>
</html>
